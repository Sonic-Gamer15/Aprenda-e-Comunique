<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alfabetização Acessível - Aprenda Brincando</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonte OpenDyslexic (Acessibilidade para Dislexia) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/open-dyslexic.css" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Estilos Customizados para Acessibilidade */
    
    /* Fontes */
    .font-opendyslexic {
      font-family: 'OpenDyslexic', 'Comic Sans MS', sans-serif !important;
      letter-spacing: 0.05em;
      word-spacing: 0.15em;
      line-height: 1.6;
    }

    .font-readable {
      font-family: 'Lexend', 'Verdana', sans-serif !important;
      letter-spacing: 0.03em;
      line-height: 1.5;
    }

    /* Modos de Alto Contraste */
    .high-contrast {
      background-color: #000000 !important;
      color: #FFFF00 !important;
    }
    .high-contrast * {
      border-color: #FFFF00 !important;
    }
    .high-contrast button, .high-contrast .card {
      background-color: #1a1a1a !important;
      color: #FFFF00 !important;
      box-shadow: 0 0 0 3px #FFFF00 !important;
    }
    .high-contrast button:hover {
      background-color: #333333 !important;
    }

    /* Animações e Foco Visual Limpo */
    :focus-visible {
      outline: 4px solid #2563EB !important;
      outline-offset: 4px !important;
    }

    .reduced-motion * {
      animation: none !important;
      transition: none !important;
    }

    /* Padrões Visuais para Daltonismo (Hatching/Patterns) */
    .pattern-red {
      background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.4) 10px, rgba(255,255,255,0.4) 20px);
    }
    .pattern-blue {
      background-image: radial-gradient(circle, rgba(255,255,255,0.4) 20%, transparent 20%);
      background-size: 15px 15px;
    }
    .pattern-yellow {
      background-image: repeating-linear-gradient(-45deg, transparent, transparent 8px, rgba(0,0,0,0.15) 8px, rgba(0,0,0,0.15) 16px);
    }
    .pattern-green {
      background-image: repeating-linear-gradient(90deg, transparent, transparent 10px, rgba(255,255,255,0.4) 10px, rgba(255,255,255,0.4) 15px);
    }
    .pattern-purple {
      background-image: radial-gradient(circle, rgba(255,255,255,0.5) 30%, transparent 30%);
      background-size: 10px 10px;
    }
    .pattern-orange {
      background-image: repeating-linear-gradient(0deg, transparent, transparent 8px, rgba(0,0,0,0.1) 8px, rgba(0,0,0,0.1) 16px);
    }

    /* Modal / Popup */
    .modal-backdrop {
      background-color: rgba(0, 0, 0, 0.75);
    }
  </style>
</head>
<body id="app-body" class="bg-slate-100 text-slate-900 font-readable min-h-screen flex flex-col transition-colors duration-300">

  <!-- BARRA DE ACESSIBILIDADE FIXA -->
  <header class="bg-white shadow-md border-b-4 border-indigo-500 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      
      <!-- LOGO E TÍTULO DA APLICAÇÃO -->
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 text-white p-3 rounded-2xl flex items-center justify-center shadow-lg">
          <i data-lucide="sparkles" class="w-8 h-8"></i>
        </div>
        <div>
          <h1 class="text-2xl font-extrabold text-indigo-700 tracking-wide" id="app-title">Aprenda Brincando</h1>
          <p class="text-xs text-slate-600 font-medium">Portal Adaptado de Alfabetização</p>
        </div>
      </div>

      <!-- PAINEL DE FERRAMENTAS DE ACESSIBILIDADE -->
      <div class="flex flex-wrap items-center gap-2 bg-slate-50 p-2 rounded-2xl border border-slate-200" aria-label="Ferramentas de Acessibilidade" role="region">
        
        <!-- Dislexia Fonte Toggle -->
        <button id="btn-dyslexia" onclick="toggleDyslexicFont()" class="px-3 py-2 bg-white border-2 border-indigo-200 rounded-xl hover:bg-indigo-50 flex items-center gap-2 text-sm font-bold text-slate-700 shadow-sm transition" title="Alternar para Fonte OpenDyslexic (Facilita leitura na Dislexia)">
          <i data-lucide="type" class="w-5 h-5 text-indigo-600"></i>
          <span>Fonte Dislexia</span>
        </button>

        <!-- Aumentar Texto -->
        <button onclick="changeFontSize(1)" class="p-2 bg-white border-2 border-indigo-200 rounded-xl hover:bg-indigo-50 text-slate-700 font-bold shadow-sm" title="Aumentar tamanho do texto" aria-label="Aumentar Fonte">
          <span class="text-lg">A+</span>
        </button>

        <!-- Diminuir Texto -->
        <button onclick="changeFontSize(-1)" class="p-2 bg-white border-2 border-indigo-200 rounded-xl hover:bg-indigo-50 text-slate-700 font-bold shadow-sm" title="Diminuir tamanho do texto" aria-label="Diminuir Fonte">
          <span class="text-sm">A-</span>
        </button>

        <!-- Alto Contraste -->
        <button id="btn-contrast" onclick="toggleHighContrast()" class="px-3 py-2 bg-white border-2 border-indigo-200 rounded-xl hover:bg-indigo-50 flex items-center gap-2 text-sm font-bold text-slate-700 shadow-sm transition" title="Alternar Alto Contraste">
          <i data-lucide="sun-moon" class="w-5 h-5 text-indigo-600"></i>
          <span>Alto Contraste</span>
        </button>

        <!-- Daltonismo (Texturas Visuais) -->
        <button id="btn-patterns" onclick="togglePatterns()" class="px-3 py-2 bg-white border-2 border-indigo-200 rounded-xl hover:bg-indigo-50 flex items-center gap-2 text-sm font-bold text-slate-700 shadow-sm transition" title="Exibir Texturas / Padrões para Daltonismo">
          <i data-lucide="eye" class="w-5 h-5 text-indigo-600"></i>
          <span>Modo Daltonismo</span>
        </button>

        <!-- Libras / Surdos Toggle -->
        <button id="btn-libras" onclick="toggleLibrasGlobal()" class="px-3 py-2 bg-white border-2 border-indigo-200 rounded-xl hover:bg-indigo-50 flex items-center gap-2 text-sm font-bold text-slate-700 shadow-sm transition" title="Ativar Suporte a Libras (Língua Brasileira de Sinais)">
          <i data-lucide="hand" class="w-5 h-5 text-indigo-600"></i>
          <span>Libras</span>
        </button>

        <!-- Reduzir Animações (Autismo / TDAH) -->
        <button id="btn-motion" onclick="toggleReducedMotion()" class="p-2 bg-white border-2 border-indigo-200 rounded-xl hover:bg-indigo-50 text-slate-700 shadow-sm" title="Reduzir Animações e Estímulos Visuais" aria-label="Reduzir Animações">
          <i data-lucide="sparkle" class="w-5 h-5 text-indigo-600"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- NAVEGAÇÃO POR CATEGORIAS -->
  <nav class="bg-indigo-900 text-white py-3 shadow-inner">
    <div class="max-w-7xl mx-auto px-4 flex justify-center gap-2 sm:gap-4 flex-wrap" role="tablist">
      
      <button onclick="switchCategory('numbers')" id="tab-numbers" class="tab-btn active px-5 py-3 rounded-2xl font-bold flex items-center gap-2 text-base transition bg-amber-400 text-indigo-950 shadow-md" role="tab" aria-selected="true">
        <i data-lucide="binary" class="w-6 h-6"></i>
        <span>1 2 3 - Números</span>
      </button>

      <button onclick="switchCategory('shapes')" id="tab-shapes" class="tab-btn px-5 py-3 rounded-2xl font-bold flex items-center gap-2 text-base transition bg-indigo-800 hover:bg-indigo-700 text-white" role="tab" aria-selected="false">
        <i data-lucide="shapes" class="w-6 h-6"></i>
        <span>Formas Geométricas</span>
      </button>

      <button onclick="switchCategory('colors')" id="tab-colors" class="tab-btn px-5 py-3 rounded-2xl font-bold flex items-center gap-2 text-base transition bg-indigo-800 hover:bg-indigo-700 text-white" role="tab" aria-selected="false">
        <i data-lucide="palette" class="w-6 h-6"></i>
        <span>Cores</span>
      </button>

      <button onclick="switchCategory('objects')" id="tab-objects" class="tab-btn px-5 py-3 rounded-2xl font-bold flex items-center gap-2 text-base transition bg-indigo-800 hover:bg-indigo-700 text-white" role="tab" aria-selected="false">
        <i data-lucide="box" class="w-6 h-6"></i>
        <span>Objetos</span>
      </button>

    </div>
  </nav>

  <!-- ÁREA PRINCIPAL DE CONTEÚDO -->
  <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
    
    <!-- MENSAGEM / FEEDBACK ACESSÍVEL -->
    <div id="screen-reader-announcer" class="sr-only" aria-live="polite"></div>

    <!-- GRADE DE CARDS INTERATIVOS -->
    <div id="content-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <!-- Os cards serão injetados via JavaScript -->
    </div>

  </main>

  <!-- MODAL DE DETALHES (LIBRAS + VOZ + LEITURA) -->
  <div id="detail-modal" class="fixed inset-0 modal-backdrop hidden items-center justify-center p-4 z-50" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="bg-white rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl relative border-4 border-indigo-500 overflow-hidden max-h-[90vh] flex flex-col justify-between">
      
      <!-- BOTÃO FECHAR -->
      <button onclick="closeModal()" class="absolute top-4 right-4 bg-rose-100 text-rose-700 hover:bg-rose-200 p-3 rounded-full transition focus:ring-4 focus:ring-rose-400" aria-label="Fechar Janela">
        <i data-lucide="x" class="w-8 h-8"></i>
      </button>

      <!-- CABEÇALHO DO MODAL -->
      <div class="text-center mb-4">
        <h2 id="modal-title" class="text-4xl font-extrabold text-indigo-900 tracking-wide">Título</h2>
        <p id="modal-subtitle" class="text-lg font-bold text-slate-500 mt-1">Legenda em Texto Claro</p>
      </div>

      <!-- VISUALIZADOR PRINCIPAL -->
      <div class="flex flex-col md:flex-row items-center justify-center gap-6 my-4 bg-slate-50 p-6 rounded-2xl border-2 border-slate-200">
        
        <!-- Elemento Gráfico / SVG / Objeto -->
        <div id="modal-graphic-container" class="w-40 h-40 flex items-center justify-center text-indigo-600 bg-white rounded-2xl shadow-inner p-4 border border-slate-200">
          <!-- Gráfico injetado dinamicamente -->
        </div>

        <!-- GIF/Vídeo ou Ilustração do Sinal em Libras -->
        <div class="flex flex-col items-center bg-indigo-50 p-4 rounded-2xl border-2 border-indigo-200 w-full md:w-auto">
          <span class="text-xs font-extrabold text-indigo-700 uppercase tracking-widest mb-2 flex items-center gap-1">
            <i data-lucide="hand" class="w-4 h-4"></i> Sinal em Libras
          </span>
          <div id="modal-libras-box" class="w-36 h-36 bg-white rounded-xl flex items-center justify-center border border-indigo-200 shadow-sm overflow-hidden text-center p-2 text-indigo-900 font-bold text-sm">
            <!-- Representação gráfica de Libras -->
          </div>
        </div>

      </div>

      <!-- PAINEL DE INTERAÇÃO E ÁUDIO -->
      <div class="flex flex-wrap justify-center gap-4 mt-4">
        
        <!-- OUVIR SOM / PRONÚNCIA -->
        <button id="btn-speak" onclick="speakCurrentItem()" class="flex-1 min-w-[180px] bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-4 px-6 rounded-2xl flex items-center justify-center gap-3 shadow-lg text-lg transition transform active:scale-95">
          <i data-lucide="volume-2" class="w-7 h-7"></i>
          <span>Ouvir Pronúncia</span>
        </button>

        <!-- REPETIR SINAL LIBRAS -->
        <button onclick="repeatLibras()" class="flex-1 min-w-[180px] bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-4 px-6 rounded-2xl flex items-center justify-center gap-3 shadow-lg text-lg transition transform active:scale-95">
          <i data-lucide="refresh-cw" class="w-7 h-7"></i>
          <span>Repetir Libras</span>
        </button>

      </div>

    </div>
  </div>

  <!-- RODAPÉ COMPACTO E INCLUSIVO -->
  <footer class="bg-slate-800 text-slate-300 py-6 mt-auto">
    <div class="max-w-7xl mx-auto px-4 text-center">
      <p class="text-sm font-semibold mb-2">Portal de Alfabetização Inclusiva — Desenvolvido para Crianças Surdas, Daltônicas e Disléxicas.</p>
      <div class="flex justify-center gap-4 text-xs text-slate-400">
        <span>✔ Fonte OpenDyslexic</span>
        <span>✔ Padrões Visuais Daltônicos</span>
        <span>✔ Suporte a Libras</span>
        <span>✔ Síntese de Voz Integrada</span>
      </div>
    </div>
  </footer>

  <!-- LÓGICA EM JAVASCRIPT -->
  <script>
    /* BANCO DE DADOS DOS ELEMENTOS EDUCATIVOS */
    const DATABASE = {
      numbers: [
        {
          id: 'num-1',
          title: '1 - Um',
          label: 'Um',
          symbol: '1',
          libras: '🤟 [Sinal do número 1: Dedo indicador levantado para cima]',
          graphic: `<span class="text-8xl font-black text-indigo-600">1</span>`,
          colorClass: 'bg-indigo-50 border-indigo-300',
          desc: 'Número um. Representa uma unidade.',
          pattern: 'pattern-blue'
        },
        {
          id: 'num-2',
          title: '2 - Dois',
          label: 'Dois',
          symbol: '2',
          libras: '✌️ [Sinal do número 2: Dedos indicador e médio levantados]',
          graphic: `<span class="text-8xl font-black text-indigo-600">2</span>`,
          colorClass: 'bg-indigo-50 border-indigo-300',
          desc: 'Número dois. Representa um par de coisas.',
          pattern: 'pattern-blue'
        },
        {
          id: 'num-3',
          title: '3 - Três',
          label: 'Três',
          symbol: '3',
          libras: '🤟 [Sinal do número 3: Polegar, indicador e médio levantados]',
          graphic: `<span class="text-8xl font-black text-indigo-600">3</span>`,
          colorClass: 'bg-indigo-50 border-indigo-300',
          desc: 'Número três.',
          pattern: 'pattern-blue'
        },
        {
          id: 'num-4',
          title: '4 - Quatro',
          label: 'Quatro',
          symbol: '4',
          libras: '🖐️ [Sinal do número 4: Quatro dedos levantados para cima]',
          graphic: `<span class="text-8xl font-black text-indigo-600">4</span>`,
          colorClass: 'bg-indigo-50 border-indigo-300',
          desc: 'Número quatro.',
          pattern: 'pattern-blue'
        },
        {
          id: 'num-5',
          title: '5 - Cinco',
          label: 'Cinco',
          symbol: '5',
          libras: '🖐️ [Sinal do número 5: Mão aberta com os dedos curvados]',
          graphic: `<span class="text-8xl font-black text-indigo-600">5</span>`,
          colorClass: 'bg-indigo-50 border-indigo-300',
          desc: 'Número cinco.',
          pattern: 'pattern-blue'
        }
      ],
      shapes: [
        {
          id: 'shape-circle',
          title: 'Círculo',
          label: 'Círculo',
          libras: '⭕ [Sinal de Círculo: Desenhar um círculo no ar com o indicador]',
          graphic: `<div class="w-32 h-32 rounded-full bg-rose-500 border-4 border-rose-700 shadow-md"></div>`,
          colorClass: 'bg-rose-50 border-rose-300',
          desc: 'O círculo é redondo como uma bola ou o sol.',
          pattern: 'pattern-red'
        },
        {
          id: 'shape-square',
          title: 'Quadrado',
          label: 'Quadrado',
          libras: '🔲 [Sinal de Quadrado: Desenhar quatro lados iguais no ar]',
          graphic: `<div class="w-32 h-32 bg-sky-500 border-4 border-sky-700 shadow-md"></div>`,
          colorClass: 'bg-sky-50 border-sky-300',
          desc: 'O quadrado tem quatro lados exatamente iguais.',
          pattern: 'pattern-blue'
        },
        {
          id: 'shape-triangle',
          title: 'Triângulo',
          label: 'Triângulo',
          libras: '🔺 [Sinal de Triângulo: Juntar os dois indicadores e polegares no topo]',
          graphic: `<div class="w-0 h-0 border-l-[60px] border-l-transparent border-r-[60px] border-r-transparent border-b-[110px] border-b-amber-500"></div>`,
          colorClass: 'bg-amber-50 border-amber-300',
          desc: 'O triângulo tem três pontas e três lados.',
          pattern: 'pattern-yellow'
        },
        {
          id: 'shape-star',
          title: 'Estrela',
          label: 'Estrela',
          libras: '⭐ [Sinal de Estrela: Apontar para o céu com dedos alternados]',
          graphic: `<i data-lucide="star" class="w-32 h-32 text-yellow-400 fill-yellow-400 stroke-yellow-600"></i>`,
          colorClass: 'bg-yellow-50 border-yellow-300',
          desc: 'A estrela tem várias pontas e brilha no céu.',
          pattern: 'pattern-yellow'
        }
      ],
      colors: [
        {
          id: 'color-red',
          title: 'Vermelho',
          label: 'Cor Vermelha (Símbolo: Listras Únicas)',
          libras: '🔴 [Sinal de Vermelho: Passar o indicador sobre o lábio inferior]',
          graphic: `<div class="w-32 h-32 rounded-3xl bg-red-600 border-4 border-red-800 shadow-md flex items-center justify-center text-white font-extrabold pattern-red">RED</div>`,
          colorClass: 'bg-red-100 border-red-400',
          desc: 'A cor vermelha é a cor da maçã e do coração.',
          pattern: 'pattern-red'
        },
        {
          id: 'color-blue',
          title: 'Azul',
          label: 'Cor Azul (Símbolo: Pontilhado)',
          libras: '🔵 [Sinal de Azul: Fazer a letra A e Z no ar no queixo]',
          graphic: `<div class="w-32 h-32 rounded-3xl bg-blue-600 border-4 border-blue-800 shadow-md flex items-center justify-center text-white font-extrabold pattern-blue">AZUL</div>`,
          colorClass: 'bg-blue-100 border-blue-400',
          desc: 'A cor azul é a cor do céu e do mar.',
          pattern: 'pattern-blue'
        },
        {
          id: 'color-yellow',
          title: 'Amarelo',
          label: 'Cor Amarela (Símbolo: Linhas Diagonais)',
          libras: '🟡 [Sinal de Amarelo: Passar as costas do indicador no nariz]',
          graphic: `<div class="w-32 h-32 rounded-3xl bg-yellow-400 border-4 border-yellow-600 shadow-md flex items-center justify-center text-slate-900 font-extrabold pattern-yellow">AMARELO</div>`,
          colorClass: 'bg-yellow-100 border-yellow-400',
          desc: 'O amarelo é a cor do sol brilhante e da banana.',
          pattern: 'pattern-yellow'
        },
        {
          id: 'color-green',
          title: 'Verde',
          label: 'Cor Verde (Símbolo: Linhas Verticais)',
          libras: '🟢 [Sinal de Verde: Balançar a mão em V no dorso da outra mão]',
          graphic: `<div class="w-32 h-32 rounded-3xl bg-emerald-600 border-4 border-emerald-800 shadow-md flex items-center justify-center text-white font-extrabold pattern-green">VERDE</div>`,
          colorClass: 'bg-emerald-100 border-emerald-400',
          desc: 'O verde é a cor das árvores e da grama.',
          pattern: 'pattern-green'
        }
      ],
      objects: [
        {
          id: 'obj-ball',
          title: 'Bola',
          label: 'Bola',
          libras: '⚽ [Sinal de Bola: Juntar as duas mãos curvadas formando uma esfera]',
          graphic: `<i data-lucide="circle-dot" class="w-32 h-32 text-orange-500"></i>`,
          colorClass: 'bg-orange-50 border-orange-300',
          desc: 'A bola é usada para jogar futebol e brincar.',
          pattern: 'pattern-orange'
        },
        {
          id: 'obj-house',
          title: 'Casa',
          label: 'Casa',
          libras: '🏠 [Sinal de Casa: Juntar as pontas dos dedos formando um telhado]',
          graphic: `<i data-lucide="home" class="w-32 h-32 text-indigo-600"></i>`,
          colorClass: 'bg-indigo-50 border-indigo-300',
          desc: 'A casa é o nosso lar e abrigo.',
          pattern: 'pattern-blue'
        },
        {
          id: 'obj-car',
          title: 'Carro',
          label: 'Carro',
          libras: '🚗 [Sinal de Carro: Mover as mãos como se segurasse um volante]',
          graphic: `<i data-lucide="car" class="w-32 h-32 text-red-600"></i>`,
          colorClass: 'bg-red-50 border-red-300',
          desc: 'O carro é um meio de transporte com quatro rodas.',
          pattern: 'pattern-red'
        },
        {
          id: 'obj-book',
          title: 'Livro',
          label: 'Livro',
          libras: '📖 [Sinal de Livro: Abrir as palmas das mãos juntas como páginas]',
          graphic: `<i data-lucide="book-open" class="w-32 h-32 text-teal-600"></i>`,
          colorClass: 'bg-teal-50 border-teal-300',
          desc: 'O livro contém histórias e conhecimento.',
          pattern: 'pattern-green'
        }
      ]
    };

    /* ESTADO DA APLICAÇÃO */
    let currentCategory = 'numbers';
    let currentSelectedItem = null;
    let isHighContrast = false;
    let isDyslexicFont = false;
    let isPatternVisible = false;
    let isLibrasAlwaysOn = false;
    let isReducedMotion = false;
    let currentFontSizeOffset = 0;

    /* INICIALIZAÇÃO */
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      renderCards();
    });

    /* TROCA DE CATEGORIAS */
    function switchCategory(category) {
      currentCategory = category;

      // Atualiza botões das abas
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-amber-400', 'text-indigo-950', 'shadow-md');
        btn.classList.add('bg-indigo-800', 'hover:bg-indigo-700', 'text-white');
        btn.setAttribute('aria-selected', 'false');
      });

      const activeTab = document.getElementById(`tab-${category}`);
      if (activeTab) {
        activeTab.classList.remove('bg-indigo-800', 'hover:bg-indigo-700', 'text-white');
        activeTab.classList.add('bg-amber-400', 'text-indigo-950', 'shadow-md');
        activeTab.setAttribute('aria-selected', 'true');
      }

      renderCards();
      announceToScreenReader(`Categoria alterada para ${category}`);
    }

    /* RENDERIZAR CARDS NA TELA */
    function renderCards() {
      const grid = document.getElementById('content-grid');
      grid.innerHTML = '';

      const items = DATABASE[currentCategory] || [];

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = `card relative flex flex-col items-center justify-between p-6 rounded-3xl border-4 ${item.colorClass} shadow-lg hover:shadow-2xl transition duration-200 transform hover:-translate-y-1 cursor-pointer bg-white ${isPatternVisible ? item.pattern : ''}`;
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');
        card.setAttribute('aria-label', `${item.title}. Clique para interagir e ver sinais de Libras.`);

        // Eventos para clique ou teclado (Enter/Espaço)
        card.onclick = () => openModal(item);
        card.onkeydown = (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openModal(item);
          }
        };

        card.innerHTML = `
          <!-- Título em Destaque -->
          <div class="text-2xl font-black text-indigo-900 mb-4 text-center tracking-wide">
            ${item.title}
          </div>

          <!-- Ilusão Visual do Elemento -->
          <div class="w-36 h-36 flex items-center justify-center my-2 bg-white/80 rounded-2xl p-2 border border-slate-200/50 shadow-inner">
            ${item.graphic}
          </div>

          <!-- Indicador Visual extra de Libras -->
          ${isLibrasAlwaysOn ? `
            <div class="mt-4 p-2 bg-indigo-100 text-indigo-900 text-xs font-bold rounded-xl text-center border border-indigo-300 w-full">
              ${item.libras}
            </div>
          ` : ''}

          <!-- Botão Ação de Ouvir Som Rápidamente -->
          <button onclick="event.stopPropagation(); speakText('${item.label}')" class="mt-4 w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold rounded-xl flex items-center justify-center gap-2 shadow transition" title="Ouvir Nome">
            <i data-lucide="volume-2" class="w-5 h-5"></i>
            <span>Ouvir</span>
          </button>
        `;

        grid.appendChild(card);
      });

      lucide.createIcons();
    }

    /* MODAL DE INTERAÇÃO DETALHADA */
    function openModal(item) {
      currentSelectedItem = item;
      
      document.getElementById('modal-title').innerText = item.title;
      document.getElementById('modal-subtitle').innerText = item.desc;
      document.getElementById('modal-graphic-container').innerHTML = item.graphic;
      document.getElementById('modal-libras-box').innerText = item.libras;

      const modal = document.getElementById('detail-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      lucide.createIcons();
      announceToScreenReader(`Aberto item: ${item.title}`);

      // Pronúncia automática inclusiva ao abrir
      speakText(item.title);
    }

    function closeModal() {
      const modal = document.getElementById('detail-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      currentSelectedItem = null;
    }

    /* SISTEMA DE VOZ (SÍNTESE DE FALA ACESSÍVEL) */
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Cancela falas anteriores
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pt-BR';
        utterance.rate = 0.85; // Velocidade ligeiramente pausada para facilitar alfabetização
        utterance.pitch = 1.1; // Tom amigável
        window.speechSynthesis.speak(utterance);
      } else {
        alert('Seu navegador não suporta a síntese de voz.');
      }
    }

    function speakCurrentItem() {
      if (currentSelectedItem) {
        speakText(`${currentSelectedItem.title}. ${currentSelectedItem.desc}`);
      }
    }

    function repeatLibras() {
      if (currentSelectedItem) {
        announceToScreenReader(`Sinal de Libras para ${currentSelectedItem.title}: ${currentSelectedItem.libras}`);
        const box = document.getElementById('modal-libras-box');
        box.classList.add('scale-105', 'bg-indigo-100');
        setTimeout(() => {
          box.classList.remove('scale-105', 'bg-indigo-100');
        }, 300);
      }
    }

    /* FERRAMENTAS DE ACESSIBILIDADE */

    // 1. Fonte OpenDyslexic
    function toggleDyslexicFont() {
      isDyslexicFont = !isDyslexicFont;
      const body = document.getElementById('app-body');
      const btn = document.getElementById('btn-dyslexia');

      if (isDyslexicFont) {
        body.classList.remove('font-readable');
        body.classList.add('font-opendyslexic');
        btn.classList.add('bg-indigo-600', 'text-white');
        announceToScreenReader('Fonte para dislexia ativada.');
      } else {
        body.classList.remove('font-opendyslexic');
        body.classList.add('font-readable');
        btn.classList.remove('bg-indigo-600', 'text-white');
        announceToScreenReader('Fonte padrão ativada.');
      }
    }

    // 2. Alto Contraste
    function toggleHighContrast() {
      isHighContrast = !isHighContrast;
      const body = document.getElementById('app-body');
      const btn = document.getElementById('btn-contrast');

      if (isHighContrast) {
        body.classList.add('high-contrast');
        btn.classList.add('bg-indigo-600', 'text-white');
        announceToScreenReader('Alto contraste ativado.');
      } else {
        body.classList.remove('high-contrast');
        btn.classList.remove('bg-indigo-600', 'text-white');
        announceToScreenReader('Alto contraste desativado.');
      }
    }

    // 3. Modos Daltonismo (Exibir padrões de textura)
    function togglePatterns() {
      isPatternVisible = !isPatternVisible;
      const btn = document.getElementById('btn-patterns');

      if (isPatternVisible) {
        btn.classList.add('bg-indigo-600', 'text-white');
        announceToScreenReader('Padrões visuais para daltonismo ativados.');
      } else {
        btn.classList.remove('bg-indigo-600', 'text-white');
        announceToScreenReader('Padrões visuais desativados.');
      }
      renderCards();
    }

    // 4. Sempre Mostrar Libras nos Cards
    function toggleLibrasGlobal() {
      isLibrasAlwaysOn = !isLibrasAlwaysOn;
      const btn = document.getElementById('btn-libras');

      if (isLibrasAlwaysOn) {
        btn.classList.add('bg-indigo-600', 'text-white');
        announceToScreenReader('Visualização fixa de Libras nos cards ativada.');
      } else {
        btn.classList.remove('bg-indigo-600', 'text-white');
        announceToScreenReader('Visualização de Libras oculta nos cards.');
      }
      renderCards();
    }

    // 5. Reduzir Animações (Movimentos)
    function toggleReducedMotion() {
      isReducedMotion = !isReducedMotion;
      const body = document.getElementById('app-body');
      const btn = document.getElementById('btn-motion');

      if (isReducedMotion) {
        body.classList.add('reduced-motion');
        btn.classList.add('bg-indigo-600', 'text-white');
        announceToScreenReader('Animações reduzidas.');
      } else {
        body.classList.remove('reduced-motion');
        btn.classList.remove('bg-indigo-600', 'text-white');
        announceToScreenReader('Animações normais reativadas.');
      }
    }

    // 6. Controle de Tamanho de Fonte
    function changeFontSize(direction) {
      currentFontSizeOffset += direction;
      if (currentFontSizeOffset > 3) currentFontSizeOffset = 3;
      if (currentFontSizeOffset < -1) currentFontSizeOffset = -1;

      const baseSize = 16 + (currentFontSizeOffset * 2);
      document.documentElement.style.fontSize = `${baseSize}px`;
      announceToScreenReader(`Tamanho do texto ajustado para grau ${currentFontSizeOffset}`);
    }

    /* AUXILIAR DE LEITURA DE TELA */
    function announceToScreenReader(message) {
      const announcer = document.getElementById('screen-reader-announcer');
      announcer.innerText = message;
    }
  </script>
</body>
</html>
